<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Pathways Prototype Demo</title>
<style>
/* Matches the deck's password page: neutral dark tokens, the prototype's grey meteors behind the card. */
:root{--bg:#090909;--bg2:#0e0e0e;--fg:#f9f9f9;--fg3:#dedede;--mut:#a1a1a6;--dim:#71717a;--line:#282828;--line2:#3a3a3a;--err:#ff6369;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro",system-ui,"Helvetica Neue",Arial,sans-serif;
  --out:cubic-bezier(.16,1,.3,1);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
body{background:linear-gradient(to bottom,var(--bg2),var(--bg) 60%)}
.meteors{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.meteor{position:absolute;top:-5%;width:2px;height:2px;border-radius:999px;background:var(--dim);box-shadow:0 0 0 1px rgba(255,255,255,.06);animation:meteor linear infinite}
.meteor::after{content:"";position:absolute;top:50%;left:0;width:50px;height:1px;transform:translateY(-50%);background:linear-gradient(to right,var(--dim),transparent)}
@keyframes meteor{0%{transform:rotate(215deg) translateX(0);opacity:1}70%{opacity:1}100%{transform:rotate(215deg) translateX(var(--meteor-distance));opacity:0}}
main{position:relative;z-index:2;min-height:100%;display:grid;place-items:center;padding:24px 16px;transition:opacity .7s var(--out),filter .7s var(--out),transform .9s var(--out)}
main.leave{opacity:0;filter:blur(18px);transform:scale(1.03)}
.card{width:min(420px,100%);padding:30px 28px 20px;border-radius:24px;text-align:center;background:rgba(20,20,20,.78);border:1px solid var(--line);-webkit-backdrop-filter:blur(20px) saturate(1.1);backdrop-filter:blur(20px) saturate(1.1);box-shadow:0 18px 28px -6px rgba(0,0,0,.9);animation:in 1.1s var(--out) both}
@keyframes in{from{opacity:0;filter:blur(14px);transform:translateY(16px) scale(.98)}}
.card.shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
.fig{display:block;height:44px;width:auto;margin:0 auto 18px}
.eyebrow{font-size:13px;font-weight:500;color:var(--mut)}
h1{margin:8px 0 6px;font-size:clamp(24px,7vw,30px);line-height:1.15;letter-spacing:-.025em;font-weight:600;white-space:nowrap}
h1 span{color:var(--mut)}
.sub{margin:0 0 22px;font-size:15px;line-height:1.5;color:var(--mut)}
form{display:flex;flex-direction:column;gap:10px}
.field{position:relative}
.field svg{position:absolute;left:16px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--dim);transition:color .3s}
input{width:100%;height:50px;padding:0 16px 0 46px;border-radius:12px;border:1px solid var(--line2);background:#121212;color:var(--fg);font:500 16px var(--sans);outline:none;transition:border-color .2s,box-shadow .2s}
input::placeholder{color:var(--dim)}
input:focus{border-color:#5a5a5e;box-shadow:0 0 0 4px rgba(255,255,255,.05)}
.field:focus-within svg{color:var(--fg)}
.bad input{border-color:var(--err);box-shadow:0 0 0 4px rgba(255,99,105,.12)}
button{height:50px;border:0;border-radius:999px;background:var(--fg);color:var(--bg);font:600 16px var(--sans);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .3s var(--out),opacity .3s,background .2s}
button:hover{background:#fff;transform:translateY(-1px)}
button:disabled{opacity:.6;cursor:default;transform:none}
button svg{width:18px;height:18px}
.msg{min-height:20px;font-size:13px;color:var(--mut);transition:color .3s}
.msg.err{color:var(--err)}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.meteors{display:none}}
</style>
</head>

<script>
// Backdrop: the prototype's grey meteors.
(() => {
'use strict';
const box = document.getElementById('meteors');
for (let k = 0; k < 22; k++) {
  const m = document.createElement('span'); m.className = 'meteor';
  m.style.left = `${(Math.random() * 130 - 35).toFixed(2)}%`;
  m.style.animationDelay = `${(Math.random() * 1 + 0.2).toFixed(2)}s`;
  m.style.animationDuration = `${Math.floor(Math.random() * 8 + 2)}s`;
  m.style.setProperty('--meteor-distance', `${-Math.floor(Math.random() * 150 + 50)}vh`);
  box.appendChild(m);
}
window.__stopBackdrop = () => box.remove();
})();

(() => {
'use strict';
// The prototype's files are encrypted in bundle.bin (salt, iv, ciphertext). Unlocking decrypts them
// into a Cache Storage cache that sw.js serves under app/, so the pages link to each other normally.
// Nothing here changes between builds: the cache is named from the bundle's salt, so a copy of this
// page from the browser cache still matches the latest bundle and service worker.
const ITER = 310000, PREFIX = 'pathways-demo-';
const TYPES = {".html":"text/html; charset=utf-8",".css":"text/css; charset=utf-8",".js":"text/javascript; charset=utf-8",".json":"application/json; charset=utf-8",".svg":"image/svg+xml",".png":"image/png",".jpg":"image/jpeg",".jpeg":"image/jpeg",".webp":"image/webp",".ico":"image/x-icon"};
const $ = id => document.getElementById(id);
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const hex = u => Array.from(u, b => b.toString(16).padStart(2, '0')).join('');
const card = $('card'), form = $('form'), pw = $('pw'), go = $('go'), msg = $('msg');

// start downloading the encrypted bundle right away, so unlocking is near-instant
const bundleP = fetch('bundle.bin', {cache: 'no-cache'}).then(async r => {
  if (!r.ok) throw new Error('bundle');
  const blob = new Uint8Array(await r.arrayBuffer());
  const salt = blob.subarray(0, 16);
  return {salt, iv: blob.subarray(16, 28), data: blob.subarray(28), cache: PREFIX + hex(salt.subarray(0, 6))};
});
bundleP.catch(() => {});

function busy(on, text){ card.classList.toggle('busy', on); go.disabled = on; pw.disabled = on; msg.className = 'msg'; msg.textContent = text || ''; }
function fail(text){
  busy(false); $('field').classList.add('bad'); msg.className = 'msg err'; msg.textContent = text;
  card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
  pw.select(); pw.focus();
}
pw.addEventListener('input', () => { $('field').classList.remove('bad'); msg.className = 'msg'; msg.textContent = ''; });

async function keyFrom(pass, salt){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations: ITER, hash:'SHA-256'}, base, {name:'AES-GCM', length: 256}, false, ['decrypt']);
}

// Wait for the newest sw.js to be in charge, so an older worker never serves the app
async function startWorker(){
  const reg = await navigator.serviceWorker.register('sw.js', {scope: './app/'});
  try { await reg.update(); } catch (e) {}
  const sw = reg.installing || reg.waiting || reg.active;
  if (sw.state !== 'activated') await new Promise(done => sw.addEventListener('statechange', () => sw.state === 'activated' && done()));
}

// ?next=page.html?… (from the deck's links) opens that page once unlocked; only plain prototype page names are honoured
const NEXT = (() => { const n = new URLSearchParams(location.search).get('next') || ''; return /^[a-z0-9-]+\.html(\?[a-z0-9=&_.-]*)?$/i.test(n) ? n : 'index.html'; })();
function open(fast){
  $('main').classList.add('leave');
  setTimeout(() => location.replace('app/' + NEXT), fast ? 0 : 650);
}

async function unlock(pass){
  const bundle = await bundleP;
  const key = await keyFrom(pass, bundle.salt);
  let plain;
  try { plain = await crypto.subtle.decrypt({name:'AES-GCM', iv: bundle.iv}, key, bundle.data); }
  catch (e) { return fail('That’s not it — try again.'); }
  busy(true, 'Opening…');
  const files = await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).json();
  for (const name of await caches.keys()) if (name.startsWith(PREFIX)) await caches.delete(name);
  const cache = await caches.open(bundle.cache);
  await Promise.all(Object.entries(files).map(([path, data]) => {
    const type = TYPES[path.slice(path.lastIndexOf('.'))] || 'application/octet-stream';
    return cache.put(new URL('app/' + path, location.href), new Response(b64d(data), {headers: {'Content-Type': type}}));
  }));
  await startWorker();
  open();
}

form.addEventListener('submit', async e => {
  e.preventDefault();
  if (!pw.value) return;
  if (!window.crypto || !crypto.subtle || !('serviceWorker' in navigator) || !window.caches) return fail('This browser can’t open the demo — open it over https in a current browser.');
  busy(true, 'Checking…');
  try { await unlock(pw.value); } catch (err) { fail('Something went wrong — try again.'); }
});

// already unlocked this version in this browser → skip the gate. Not when sw.js just sent us
// back here (#locked): the files were missing, and skipping again would loop.
(async () => {
  try {
    if (location.hash === '#locked') { history.replaceState(null, '', location.pathname + location.search); return; }
    if (!window.caches || !('serviceWorker' in navigator) || !await caches.has((await bundleP).cache)) return;
    busy(true, 'Opening…');
    await startWorker();
    open(true);
  } catch (e) { busy(false); }
})();
})();
</script>
