<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Pathways Concept Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
:root{--bg:#050506;--fg:#f5f5f7;--mut:#a1a1a6;--dim:#6e6e73;--line:rgba(255,255,255,.1);--line2:rgba(255,255,255,.18);--run:#ff6b3d;--err:#ff6961;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,sans-serif;--serif:"Instrument Serif",Georgia,serif;--mono:"Geist Mono",ui-monospace,Menlo,monospace;
  --out:cubic-bezier(.16,1,.3,1);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
.aurora{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.aurora i{position:absolute;width:62vmax;height:62vmax;border-radius:50%;filter:blur(110px);opacity:.26;mix-blend-mode:screen;animation:drift 26s ease-in-out infinite alternate}
.aurora i:nth-child(1){background:#ff6b3d;left:-18vmax;top:-22vmax}
.aurora i:nth-child(2){background:#bf5af2;right:-20vmax;top:10vmax;animation-duration:32s;animation-delay:-8s}
.aurora i:nth-child(3){background:#64d2ff;left:20vmax;bottom:-34vmax;animation-duration:38s;opacity:.16}
@keyframes drift{50%{transform:translate(6vmax,4vmax) scale(1.12)}100%{transform:translate(-4vmax,7vmax) scale(.94)}}
.grain{position:fixed;inset:-100%;pointer-events:none;opacity:.05;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");animation:grain 1.2s steps(6) infinite}
@keyframes grain{20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,-1%)}80%{transform:translate(3%,3%)}}
main{position:relative;min-height:100%;display:grid;place-items:center;padding:24px 16px;transition:opacity .7s var(--out),filter .7s var(--out),transform .9s var(--out)}
main.leave{opacity:0;filter:blur(18px);transform:scale(1.04)}
.card{position:relative;width:min(440px,100%);padding:38px 32px 24px;border-radius:30px;text-align:center;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid var(--line);-webkit-backdrop-filter:blur(28px) saturate(150%);backdrop-filter:blur(28px) saturate(150%);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 50px 120px -40px rgba(0,0,0,.8);animation:in 1.1s var(--out) both}
@keyframes in{from{opacity:0;filter:blur(16px);transform:translateY(18px) scale(.98)}}
.card::after{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1.2px;background:conic-gradient(from var(--ang),transparent 0 62%,#ff6b3d 74%,#fff 80%,#bf5af2 86%,transparent 96%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 6s linear infinite;pointer-events:none}
@keyframes spin{to{--ang:360deg}}
.card.shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
.orb{width:64px;height:64px;margin:0 auto 22px;border-radius:50%;position:relative;background:conic-gradient(from var(--ang),#ff6b3d,#ff375f,#bf5af2,#64d2ff,#30d158,#ff6b3d);animation:spin 6s linear infinite;box-shadow:0 0 50px -6px rgba(191,90,242,.75)}
.orb::before{content:"";position:absolute;inset:0;border-radius:50%;background:inherit;filter:blur(12px);opacity:.7}
.orb::after{content:"";position:absolute;inset:3px;border-radius:50%;background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.95),rgba(255,255,255,0) 38%),radial-gradient(circle at 70% 78%,rgba(0,0,0,.45),transparent 60%)}
.busy .orb{animation-duration:1.1s}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
h1{margin:10px 0 6px;font-size:40px;line-height:1;letter-spacing:-.045em;font-weight:700}
h1 em{font-family:var(--serif);font-weight:400;letter-spacing:-.02em;background:linear-gradient(100deg,#ffb37a,#ff6b3d 30%,#ff375f 55%,#bf5af2 80%,#64d2ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:0 0 26px;font-size:15px;line-height:1.5;color:var(--mut)}
form{display:flex;flex-direction:column;gap:12px}
.field{position:relative}
.field svg{position:absolute;left:16px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--dim);transition:color .3s}
input{width:100%;height:54px;padding:0 16px 0 46px;border-radius:16px;border:1px solid var(--line2);background:rgba(0,0,0,.35);color:var(--fg);font:500 16px var(--sans);letter-spacing:.02em;outline:none;transition:border-color .3s,box-shadow .3s}
input::placeholder{color:var(--dim)}
input:focus{border-color:rgba(255,255,255,.4);box-shadow:0 0 0 4px rgba(255,255,255,.06)}
.field:focus-within svg{color:var(--fg)}
.bad input{border-color:var(--err);box-shadow:0 0 0 4px rgba(255,105,97,.12)}
button{height:54px;border:0;border-radius:16px;background:var(--fg);color:#000;font:600 16px var(--sans);letter-spacing:-.01em;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;position:relative;overflow:hidden;transition:transform .3s var(--out),opacity .3s}
button::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.9) 50%,transparent 70%);transform:translateX(-120%);animation:sheen 3.2s ease-in-out infinite}
@keyframes sheen{60%,100%{transform:translateX(120%)}}
button:hover{transform:translateY(-1px)}
button:disabled{opacity:.6;cursor:default;transform:none}
button svg{width:18px;height:18px;position:relative}
button span{position:relative}
.msg{min-height:20px;font-size:13px;color:var(--mut);transition:color .3s}
.msg.err{color:var(--err)}
.bar{height:3px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;opacity:0;transition:opacity .3s}
.busy .bar{opacity:1}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff6b3d,#bf5af2);transition:width .25s}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="grain" aria-hidden="true"></div>
<main id="main">
  <div class="card" id="card">
    <div class="orb" aria-hidden="true"></div>
    <div class="eyebrow">Private preview</div>
    <h1>Pathways <em>concept review</em></h1>
    <p class="sub">This presentation is password protected.<br>Enter the password to continue.</p>
    <form id="form" autocomplete="off">
      <div class="field" id="field">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        <input id="pw" type="password" placeholder="Password" aria-label="Password" autofocus required>
      </div>
      <button id="go" type="submit"><span>Unlock</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      <div class="bar" aria-hidden="true"><i id="bar"></i></div>
      <div class="msg" id="msg" role="status" aria-live="polite"></div>
    </form>
  </div>
</main>

uzMi5NqpQ9pjr4IOMGJDJFZPnI55Sdzmy/CT/T54GImwHpK1/lMPsGHeKg0OAYLggHkj8G8HKGKJ+M/LjDLpUYIh/D6JbCYY3tNcM8eS1U0j/2QpxAQguYDMo90FcNaC64yzDPo4cj5f3PrJnrR7/5SCgt3Ay00+0HfqYNK4l21uVfEH55/cIqy/41KGcR+tp1yrO6kuZ6O/MJZlm6tRcqTc/eX7vol3j8Gnt5qfJK/rFAWKqHWmAMAtjkWdg34sa5hdbhnvCRGZcnyv95eNfZDpOfZjJghmo13pzNb5h8I5TK0nfTCHbNOKWLY14j9VCqZR7DHDV2/WcvFS8oqnEaNenikeW59M+GHRFf/Qv9xruEjsxyFJ4aX96X4KYBxbevaNAm9HKrtDUUSmcko/ctxw45b2PMRfKc9kU0grVONAgjnDcRocuDobFkG/5GWOUlZhc9KfDyVhBBn31RqeHwFrwm6heXEtCVJeOaLOfZxFYDFrXJuoovTFDOh8aJuRgkmA4m5l0CygyKYK/FdaXBg2Pb9eT66SKUzzs4=', FILM_PATH = 'Untitled%20video%20(1).mp4', STORE = 'pathways-key';
const $ = id => document.getElementById(id);
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64e = u => { let s = ''; u.forEach(b => s += String.fromCharCode(b)); return btoa(s); };
const salt = b64d(SALT), payload = b64d(PAYLOAD);
const card = $('card'), form = $('form'), pw = $('pw'), go = $('go'), msg = $('msg'), bar = $('bar');

// start downloading the encrypted film right away, so unlocking is near-instant
let loaded = 0, total = 0;
const filmP = fetch('film.bin').then(async r => {
  if (!r.ok) throw new Error('film');
  total = +r.headers.get('content-length') || 0;
  if (!r.body || !total) return new Uint8Array(await r.arrayBuffer());
  const reader = r.body.getReader(), out = new Uint8Array(total);
  for (;;) { const {done, value} = await reader.read(); if (done) break; out.set(value, loaded); loaded += value.length; }
  return out.subarray(0, loaded);
});
filmP.catch(() => {});

const decrypt = (key, blob) => crypto.subtle.decrypt({name:'AES-GCM', iv: blob.subarray(0, 12)}, key, blob.subarray(12));
async function bitsFrom(pass){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2', salt, iterations: ITER, hash:'SHA-256'}, base, 256));
}
function busy(on, text){ card.classList.toggle('busy', on); go.disabled = on; pw.disabled = on; msg.className = 'msg'; msg.textContent = text || ''; }
function fail(text){
  busy(false); $('field').classList.add('bad'); msg.className = 'msg err'; msg.textContent = text;
  card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
  pw.select(); pw.focus();
}
pw.addEventListener('input', () => { $('field').classList.remove('bad'); msg.className = 'msg'; msg.textContent = ''; });

async function unlock(bits, remembered){
  const key = await crypto.subtle.importKey('raw', bits, 'AES-GCM', false, ['decrypt']);
  let html;
  try { html = new TextDecoder().decode(await decrypt(key, payload)); }
  catch (e) { if (remembered) { sessionStorage.removeItem(STORE); busy(false); return; } return fail('That’s not it — try again.'); }
  try { sessionStorage.setItem(STORE, b64e(bits)); } catch (e) {}
  busy(true, 'Unlocking the film…');
  const tick = setInterval(() => { if (total) { bar.style.width = (loaded / total * 100).toFixed(1) + '%'; msg.textContent = `Unlocking the film · ${Math.round(loaded / total * 100)}%`; } }, 120);
  let filmUrl = FILM_PATH;
  try {
    const film = await filmP;
    filmUrl = URL.createObjectURL(new Blob([await decrypt(key, film)], {type:'video/mp4'}));
  } catch (e) { /* the deck still works without the film */ }
  clearInterval(tick); bar.style.width = '100%'; msg.textContent = 'Opening…';
  $('main').classList.add('leave');
  setTimeout(() => {
    const out = html.split(FILM_PATH).join(filmUrl);
    document.open(); document.write(out); document.close();
  }, remembered ? 0 : 650);
}

form.addEventListener('submit', async e => {
  e.preventDefault();
  if (!pw.value) return;
  if (!window.crypto || !crypto.subtle) return fail('This browser can’t decrypt the page — open it over https.');
  busy(true, 'Checking…');
  try { await unlock(await bitsFrom(pw.value)); } catch (err) { fail('Something went wrong — try again.'); }
});

// same tab, already unlocked this session → skip the gate
try {
  const saved = sessionStorage.getItem(STORE);
  if (saved && window.crypto && crypto.subtle) { busy(true, 'Unlocking…'); unlock(b64d(saved), true); }
} catch (e) {}
})();
