<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Pathways Concept Review</title>
<style>
/* Neutral, in the deck's dark tokens, with the prototype's grey meteors falling behind the card. */
:root{--bg:#090909;--bg2:#0e0e0e;--fg:#f9f9f9;--fg3:#dedede;--mut:#a1a1a6;--dim:#71717a;--line:#282828;--line2:#3a3a3a;--err:#ff6369;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro",system-ui,"Helvetica Neue",Arial,sans-serif;
  --out:cubic-bezier(.16,1,.3,1);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
body{background:linear-gradient(to bottom,var(--bg2),var(--bg) 60%)}
.meteors{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.meteor{position:absolute;top:-5%;width:2px;height:2px;border-radius:999px;background:var(--dim);box-shadow:0 0 0 1px rgba(255,255,255,.06);animation:meteor linear infinite}
.meteor::after{content:"";position:absolute;top:50%;left:0;width:50px;height:1px;transform:translateY(-50%);background:linear-gradient(to right,var(--dim),transparent)}
@keyframes meteor{0%{transform:rotate(215deg) translateX(0);opacity:1}70%{opacity:1}100%{transform:rotate(215deg) translateX(var(--meteor-distance));opacity:0}}
main{position:relative;z-index:2;min-height:100%;display:grid;place-items:center;padding:24px 16px;transition:opacity .7s var(--out),filter .7s var(--out),transform .9s var(--out)}
main.leave{opacity:0;filter:blur(18px);transform:scale(1.03)}
.card{width:min(420px,100%);padding:30px 28px 20px;border-radius:24px;text-align:center;background:rgba(20,20,20,.78);border:1px solid var(--line);-webkit-backdrop-filter:blur(20px) saturate(1.1);backdrop-filter:blur(20px) saturate(1.1);box-shadow:0 18px 28px -6px rgba(0,0,0,.9);animation:in 1.1s var(--out) both}
@keyframes in{from{opacity:0;filter:blur(14px);transform:translateY(16px) scale(.98)}}
.card.shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
.fig{display:block;height:44px;width:auto;margin:0 auto 18px}
.eyebrow{font-size:13px;font-weight:500;color:var(--mut)}
h1{margin:8px 0 6px;font-size:clamp(24px,7vw,30px);line-height:1.15;letter-spacing:-.025em;font-weight:600;white-space:nowrap}
h1 span{color:var(--mut)}
.sub{margin:0 0 22px;font-size:15px;line-height:1.5;color:var(--mut)}
form{display:flex;flex-direction:column;gap:10px}
.field{position:relative}
.field svg{position:absolute;left:16px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--dim);transition:color .3s}
input{width:100%;height:50px;padding:0 16px 0 46px;border-radius:12px;border:1px solid var(--line2);background:#121212;color:var(--fg);font:500 16px var(--sans);outline:none;transition:border-color .2s,box-shadow .2s}
input::placeholder{color:var(--dim)}
input:focus{border-color:#5a5a5e;box-shadow:0 0 0 4px rgba(255,255,255,.05)}
.field:focus-within svg{color:var(--fg)}
.bad input{border-color:var(--err);box-shadow:0 0 0 4px rgba(255,99,105,.12)}
button{height:50px;border:0;border-radius:999px;background:var(--fg);color:var(--bg);font:600 16px var(--sans);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .3s var(--out),opacity .3s,background .2s}
button:hover{background:#fff;transform:translateY(-1px)}
button:disabled{opacity:.6;cursor:default;transform:none}
button svg{width:18px;height:18px}
.msg{min-height:20px;font-size:13px;color:var(--mut);transition:color .3s}
.msg.err{color:var(--err)}
.bar{height:3px;border-radius:3px;background:#2c2c2e;overflow:hidden;opacity:0;transition:opacity .3s}
.busy .bar{opacity:1}
.bar i{display:block;height:100%;width:0;background:var(--fg);transition:width .25s}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.meteors{display:none}}
</style>
</head>

w8aO30ZBMqCfXV+SgmOrZaumI8a8ozisto/eUBxtu9KLJOe7/DVvb8INVBDbRKZxRP1OiYfK7rxos4Nn0NOLLKUCCpgvA==', FILM_PATH = 'Untitled%20video%20(1).mp4', STORE = 'pathways-key';
const $ = id => document.getElementById(id);
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64e = u => { let s = ''; u.forEach(b => s += String.fromCharCode(b)); return btoa(s); };
const salt = b64d(SALT), payload = b64d(PAYLOAD);
const card = $('card'), form = $('form'), pw = $('pw'), go = $('go'), msg = $('msg'), bar = $('bar');

// start downloading the encrypted film right away, so unlocking is near-instant
let loaded = 0, total = 0;
const filmP = fetch('film.bin').then(async r => {
  if (!r.ok) throw new Error('film');
  total = +r.headers.get('content-length') || 0;
  if (!r.body || !total) return new Uint8Array(await r.arrayBuffer());
  const reader = r.body.getReader(), out = new Uint8Array(total);
  for (;;) { const {done, value} = await reader.read(); if (done) break; out.set(value, loaded); loaded += value.length; }
  return out.subarray(0, loaded);
});
filmP.catch(() => {});

const decrypt = (key, blob) => crypto.subtle.decrypt({name:'AES-GCM', iv: blob.subarray(0, 12)}, key, blob.subarray(12));
async function bitsFrom(pass){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2', salt, iterations: ITER, hash:'SHA-256'}, base, 256));
}
function busy(on, text){ card.classList.toggle('busy', on); go.disabled = on; pw.disabled = on; msg.className = 'msg'; msg.textContent = text || ''; }
function fail(text){
  busy(false); $('field').classList.add('bad'); msg.className = 'msg err'; msg.textContent = text;
  card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
  pw.select(); pw.focus();
}
pw.addEventListener('input', () => { $('field').classList.remove('bad'); msg.className = 'msg'; msg.textContent = ''; });

async function unlock(bits, remembered){
  const key = await crypto.subtle.importKey('raw', bits, 'AES-GCM', false, ['decrypt']);
  let html;
  try { html = new TextDecoder().decode(await decrypt(key, payload)); }
  catch (e) { if (remembered) { sessionStorage.removeItem(STORE); busy(false); return; } return fail('That’s not it — try again.'); }
  try { sessionStorage.setItem(STORE, b64e(bits)); } catch (e) {}
  busy(true, 'Unlocking the film…');
  const tick = setInterval(() => { if (total) { bar.style.width = (loaded / total * 100).toFixed(1) + '%'; msg.textContent = `Unlocking the film · ${Math.round(loaded / total * 100)}%`; } }, 120);
  let filmUrl = FILM_PATH;
  try {
    const film = await filmP;
    filmUrl = URL.createObjectURL(new Blob([await decrypt(key, film)], {type:'video/mp4'}));
  } catch (e) { /* the deck still works without the film */ }
  clearInterval(tick); bar.style.width = '100%'; msg.textContent = 'Opening…';
  $('main').classList.add('leave');
  setTimeout(() => {
    window.__stopBackdrop && window.__stopBackdrop();
    const out = html.split(FILM_PATH).join(filmUrl);
    document.open(); document.write(out); document.close();
  }, remembered ? 0 : 650);
}

form.addEventListener('submit', async e => {
  e.preventDefault();
  if (!pw.value) return;
  if (!window.crypto || !crypto.subtle) return fail('This browser can’t decrypt the page — open it over https.');
  busy(true, 'Checking…');
  try { await unlock(await bitsFrom(pw.value)); } catch (err) { fail('Something went wrong — try again.'); }
});

// same tab, already unlocked this session → skip the gate
try {
  const saved = sessionStorage.getItem(STORE);
  if (saved && window.crypto && crypto.subtle) { busy(true, 'Unlocking…'); unlock(b64d(saved), true); }
} catch (e) {}
})();
